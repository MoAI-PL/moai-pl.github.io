<html lang="pl">
<head>

  <meta name="twitter:description" content="Konkursy, hackathony, konferencje naukowe i warsztaty Koła Naukowego MoAI na Politechnice Lubelskiej.">
  <meta name="twitter:image" content="https://moai-pl.github.io/images/mics/moai_og.png">

  <link rel="canonical" href="https://moai-pl.github.io/events/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
  <link rel="manifest" href="../icons/site.webmanifest">
  <link rel="stylesheet" href="../styles.css">
  <script>
    (function () {
      var lang = 'en';
      try {
        var saved = localStorage.getItem('moai-lang');
        if (saved === 'pl' || saved === 'en') lang = saved;
        else if (Intl.DateTimeFormat().resolvedOptions().timeZone === 'Europe/Warsaw') lang = 'pl';
      } catch (e) {
        lang = 'pl';
      }
      document.documentElement.lang = lang;
      document.documentElement.setAttribute('data-lang', lang);
    })();
  </script>
</head>
<body data-page="events">
  <div id="top"></div>
  <div id="preloader" class="preloader" data-i18n-aria="preloader" aria-label="Trwa ładowanie strony" role="status">
    <div class="preloader__glass">
      <span class="preloader__dot">M</span>
      <span class="preloader__dot">o</span>
      <span class="preloader__dot">A</span>
      <span class="preloader__dot">I</span>
    </div>
  </div>

  <svg class="sr-only" aria-hidden="true" focusable="false">
    <symbol id="icon-linkedin" viewBox="0 0 24 24">
      <path fill="currentColor" d="M19 0H5C2.24 0 0 2.24 0 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5V5c0-2.76-2.24-5-5-5zM8.34 19H5.67V9.67h2.67V19zM7 8.45A1.56 1.56 0 1 1 7 5.34a1.56 1.56 0 0 1 0 3.11zM19 19h-2.67v-5.6c0-1.33-.48-2.24-1.68-2.24-.92 0-1.47.62-1.71 1.22-.09.22-.11.52-.11.82V19h-2.67V9.67h2.67v1.28c.35-.54 1.23-1.32 2.9-1.32 2.12 0 3.26 1.38 3.26 4.06V19z" />
    </symbol>
  </svg>

  <header class="nav-shell">
    <nav class="nav">
      <div class="nav__links">
        <a href="/" class="nav__link">MoAI</a>
        <a href="/#events" class="nav__link" data-i18n="nav.events">Wydarzenia</a>
        <a href="/#projects" class="nav__link" data-i18n="nav.projects">Projekty</a>
        <a href="/#join" class="nav__link" data-i18n="nav.join">Dołącz</a>
        <a href="/#contact" class="nav__link" data-i18n="nav.contact">Kontakt</a>
        <button type="button" class="nav__link lang-toggle lang-toggle--nav" data-lang-toggle aria-label="Switch to English">PL</button>
      </div>
    </nav>
    <button type="button" class="lang-toggle lang-toggle--corner" data-lang-toggle aria-label="Switch to English">PL</button>
  </header>

  <main class="page">
    <section class="section" aria-labelledby="events-gallery-title">
      <div class="section__header">
        <div>
          <h2 id="events-gallery-title" data-i18n="events.pageTitle">Wydarzenia</h2>
          <p class="muted" data-i18n="events.pageBody">Nie przestajemy się rozwijać - chętnie bierzemy udział w technologicznych, biznesowych i akademickich. Zobacz gdzie byliśmy:</p>
        </div>
      </div>
      <div id="projects-grid" class="cards cards--three" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>MoAI © <span data-current-year>2026</span></span>
      <a class="footer__link" href="../assets/Statut_MoAI.pdf" target="_blank" data-i18n="footer.rules">Regulamin</a>
      <a class="footer__link" href="mailto:moai@pollub.edu.pl">moai@pollub.edu.pl</a>
      <a class="footer__logo" href="https://wz.pollub.pl/" target="_blank" rel="noopener">
        <img src="../icons/logo_wz.webp" alt="Wydział Zarządzania Politechniki Lubelskiej" loading="lazy" data-i18n-alt="footer.wz">
      </a>
    </div>
  </footer>
  <script src="../i18n.js" defer></script>
  <script src="../scripts.js" defer></script>
  <script data-goatcounter="https://moai-pl.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
